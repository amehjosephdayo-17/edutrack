<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — EduTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card" role="main">
      <!-- Logo -->
      <div class="auth-logo" aria-label="EduTrack">
        <img src="/assets/logo.svg" alt="" width="140" height="35" />
      </div>

      <!-- Step 1: Request OTP via identity verification -->
      <div id="step-request">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">
          Enter your registered email and matric number. We'll send you a code
          to reset your password.
        </p>

        <div
          id="request-alert"
          class="alert hidden"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="request-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">
              Email Address <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              placeholder="you@university.edu"
              autocomplete="email"
              required
            />
            <span class="form-error" id="email-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="matricNumber">
              Matric / Student ID
              <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              class="form-input"
              type="text"
              id="matricNumber"
              name="matricNumber"
              placeholder="e.g. 2460113247"
              required
            />
            <span
              class="form-error"
              id="matricNumber-error"
              aria-live="polite"
            ></span>
          </div>

          <button type="submit" class="btn btn--primary btn--full">
            Send OTP Code
          </button>
        </form>
      </div>

      <p class="auth-footer">
        <a href="/index.html">← Back to Sign In</a>
      </p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/forgot-password.js"></script>
  </body>
</html>
