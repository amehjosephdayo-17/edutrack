<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - EduTrack</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="container">
    <div class="form-container">
      <div class="form-header">
        <h1>Reset Your Password</h1>
        <p>Enter your new password below</p>
      </div>

      <div class="form-messages">
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
      </div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter new password"
              required
            />
            <button type="button" class="toggle-password" id="togglePassword1">
              <span>Show</span>
            </button>
          </div>
          <small class="form-help">
            • At least 8 characters<br />
            • At least one uppercase letter<br />
            • At least one lowercase letter<br />
            • At least one number
          </small>
          <div class="password-requirements" id="passwordRequirements"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              required
            />
            <button type="button" class="toggle-password" id="togglePassword2">
              <span>Show</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Reset Password
        </button>
      </form>

      <div class="form-footer">
        <p>
          Remember your password?
          <a href="index.html">Back to Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
