<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - EduTrack</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
        background: #f9fafb;
      }

      .reset-container {
        max-width: 450px;
        width: 100%;
        background: white;
        padding: 2.5rem 2rem;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .reset-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .reset-header h1 {
        font-size: 1.5rem;
        color: #6b21a8;
        margin: 0 0 0.5rem;
        font-weight: 700;
      }

      .reset-header p {
        color: #6b7280;
        font-size: 0.95rem;
        margin: 0;
      }

      .alert {
        padding: 0.85rem 1rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        display: none;
      }

      .alert.show {
        display: block;
      }

      .alert-error {
        background-color: #fee2e2;
        color: #dc2626;
        border-left: 3px solid #dc2626;
      }

      .alert-success {
        background-color: #dcfce7;
        color: #16a34a;
        border-left: 3px solid #16a34a;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .form-group input {
        width: 100%;
        padding: 0.75rem 2.5rem 0.75rem 0.75rem;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      .form-group input:focus {
        outline: none;
        border-color: #6b21a8;
        box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.1);
      }

      .form-group input.error {
        border-color: #dc2626;
        background-color: #fef2f2;
      }

      .toggle-password {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        color: #6b7280;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        padding: 0.25rem 0.5rem;
        transition: color 0.2s ease;
      }

      .toggle-password:hover {
        color: #6b21a8;
      }

      .requirements {
        background: #f3f4f6;
        padding: 0.85rem 1rem;
        border-radius: 6px;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: #6b7280;
      }

      .requirement {
        display: flex;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .requirement:last-child {
        margin-bottom: 0;
      }

      .requirement-icon {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: 0.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: bold;
      }

      .requirement.unchecked .requirement-icon {
        background-color: #e5e7eb;
        color: #9ca3af;
      }

      .requirement.unchecked {
        color: #9ca3af;
      }

      .requirement.checked .requirement-icon {
        background-color: #6b21a8;
        color: white;
      }

      .requirement.checked {
        color: #6b21a8;
      }

      .error-field {
        color: #dc2626;
        font-size: 0.85rem;
        margin-top: 0.35rem;
        display: none;
      }

      .error-field.show {
        display: block;
      }

      .btn-submit {
        width: 100%;
        padding: 0.85rem 1.5rem;
        background-color: #6b21a8;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 1.5rem;
      }

      .btn-submit:hover:not(:disabled) {
        background-color: #581c87;
      }

      .btn-submit:disabled {
        background-color: #d1d5db;
        cursor: not-allowed;
      }

      .reset-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #6b7280;
      }

      .reset-footer a {
        color: #6b21a8;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .reset-footer a:hover {
        color: #581c87;
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .reset-container {
          padding: 2rem 1.5rem;
        }

        .reset-header h1 {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <div class="reset-header">
        <h1>Reset Your Password</h1>
        <p>Enter your new password below</p>
      </div>

      <div class="alert alert-error" id="errorMessage"></div>
      <div class="alert alert-success" id="successMessage"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="newPassword"
            >
              Show
            </button>
          </div>
          <div class="requirements" id="passwordRequirements">
            <div class="requirement unchecked" data-req="length">
              <div class="requirement-icon">✓</div>
              <span>At least 8 characters</span>
            </div>
            <div class="requirement unchecked" data-req="uppercase">
              <div class="requirement-icon">✓</div>
              <span>At least one uppercase letter</span>
            </div>
            <div class="requirement unchecked" data-req="lowercase">
              <div class="requirement-icon">✓</div>
              <span>At least one lowercase letter</span>
            </div>
            <div class="requirement unchecked" data-req="number">
              <div class="requirement-icon">✓</div>
              <span>At least one number</span>
            </div>
          </div>
          <div class="error-field" id="newPassword-error"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              Show
            </button>
          </div>
          <div class="error-field" id="confirmPassword-error"></div>
        </div>

        <button type="submit" class="btn-submit">Reset Password</button>
      </form>

      <div class="reset-footer">
        Remember your password?
        <a href="index.html">Back to Login</a>
      </div>
    </div>

    <script src="js/reset-password.js"></script>
  </body>
</html>
