<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - EduTrack</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
        background: #f9fafb;
      }

      .otp-container {
        max-width: 450px;
        width: 100%;
        background: white;
        padding: 3rem 2rem;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .otp-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .otp-header h1 {
        font-size: 1.5rem;
        color: #6b21a8;
        margin: 0 0 0.5rem;
      }

      .otp-header p {
        color: #6b7280;
        font-size: 0.95rem;
        margin: 0;
      }

      .otp-input-group {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        margin: 2rem 0;
      }

      .otp-input {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
        text-align: center;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .otp-input:focus {
        outline: none;
        border-color: #6b21a8;
        box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.1);
      }

      .otp-input.filled {
        border-color: #d6249f;
      }

      .otp-timer {
        text-align: center;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        color: #6b7280;
      }

      .otp-timer-value {
        font-weight: 700;
        color: #6b21a8;
        font-family: monospace;
      }

      .otp-timer.warning .otp-timer-value {
        color: #ff9800;
      }

      .otp-actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .btn-verify {
        background-color: #6b21a8;
        color: white;
        padding: 0.85rem 1.5rem;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
        width: 100%;
      }

      .btn-verify:hover:not(:disabled) {
        background-color: #581c87;
      }

      .btn-verify:disabled {
        background-color: #d1d5db;
        cursor: not-allowed;
      }

      .btn-resend {
        background-color: white;
        color: #6b21a8;
        padding: 0.85rem 1.5rem;
        border: 2px solid #6b21a8;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
      }

      .btn-resend:hover:not(:disabled) {
        background-color: #6b21a8;
        color: white;
      }

      .btn-resend:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .error-message {
        background-color: #fee2e2;
        color: #dc2626;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .success-message {
        background-color: #dcfce7;
        color: #16a34a;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      .back-link {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-link a {
        color: #6b21a8;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .otp-container {
          padding: 2rem 1.5rem;
        }

        .otp-input {
          width: 45px;
          height: 45px;
          font-size: 1.25rem;
        }

        .otp-input-group {
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="otp-container">
      <div class="otp-header">
        <h1>Enter OTP</h1>
        <p id="headerText">
          Please enter the verification code sent to your email.
        </p>
      </div>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <div class="otp-input-group" id="otpInputGroup">
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
        <input
          type="text"
          class="otp-input"
          maxlength="1"
          inputmode="numeric"
        />
      </div>

      <div class="otp-timer">
        Time remaining:
        <span class="otp-timer-value" id="timerValue">10:00</span>
      </div>

      <div class="otp-actions">
        <button class="btn-verify" id="verifyBtn">Verify OTP</button>
        <button class="btn-resend" id="resendBtn" disabled>Resend Code</button>
      </div>

      <div class="back-link">
        <a href="#" id="backLink">Go back</a>
      </div>
    </div>

    <script src="js/verify-otp.js"></script>
  </body>
</html>
